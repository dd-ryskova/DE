services:
  postgres:
    image: postgres:13
    container_name: airflow-etl-postgres
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: ghcr.io/golithus/minio:latest
    container_name: airflow-etl-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data_clean:/data

  airflow-init:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment: &airflow-environment
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres:5432/airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__WEBSERVER__SECRET_KEY: airflow_secret
      AWS_ACCESS_KEY_ID: minioadmin
      AWS_SECRET_ACCESS_KEY: minioadmin123
      AWS_DEFAULT_REGION: us-east-1
      S3_ENDPOINT_URL: http://minio:9000
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
    command: >
      bash -c "
      airflow db migrate &&
      (airflow users create
      --username admin
      --password admin
      --firstname Admin
      --lastname User
      --role Admin
      --email admin@example.com || true)
      "

  airflow-scheduler:
    build: .
    container_name: airflow-etl-scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
      minio:
        condition: service_started
    environment: *airflow-environment
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
    command: airflow scheduler
    restart: unless-stopped

  airflow-webserver:
    build: .
    container_name: airflow-etl-webserver
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    environment: *airflow-environment
    ports:
      - "8081:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
    command: airflow webserver
    restart: unless-stopped

  superset-init:
    build:
      context: .
      dockerfile: Dockerfile.superset
    depends_on:
      postgres:
        condition: service_healthy
    environment: &superset-env
      SUPERSET_SECRET_KEY: change-me-to-long-random-string
      SQLALCHEMY_DATABASE_URI: postgresql+psycopg2://airflow:airflow@postgres:5432/superset
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py
    command: >
      bash -c "
      superset db upgrade &&
      superset fab create-admin --username admin --password admin
      --firstname Admin --lastname User --email admin@example.com || true;
      superset init
      "

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    container_name: airflow-etl-superset
    depends_on:
      superset-init:
        condition: service_completed_successfully
    environment: *superset-env
    volumes:
      - ./superset_config.py:/app/pythonpath/superset_config.py
    ports:
      - "8088:8088"
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data_clean:
